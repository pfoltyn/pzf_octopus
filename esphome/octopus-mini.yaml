substitutions:
  device_name: "octopus-mini"

esphome:
  name: ${device_name}
  comment: "ESP32-C3 Supermini — passive Octopus Home Mini meter reader"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf     # mbedTLS AES-CCM* available (needed by the decoder)

# Enable logging (over USB-Serial-JTAG on the C3; does not touch the tap pin)
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name} Fallback Hotspot
    password: !secret wifi_password

captive_portal:

web_server:
  port: 80

# External component (pulled from GitHub; no local files needed).
# For local development against ./components instead, use:
#   - source: {type: local, path: components}
external_components:
  - source: github://pfoltyn/pzf_octopus@main
    components: [octopus_mini]
    refresh: 1d

sensor:
  - platform: wifi_signal
    name: ${device_name} Wifi Signal Strength
    update_interval: 90s
    entity_category: "diagnostic"

  - platform: uptime
    name: ${device_name} Uptime
    update_interval: 300s
    entity_category: "diagnostic"

  # Gas volume (m³) -> energy (kWh) so the £/kWh gas price works in the Energy
  # dashboard. UK formula: m³ × volume-correction (1.02264) × calorific value
  # (≈39.5 MJ/m³) ÷ 3.6. Adjust the calorific value to your gas network's figure
  # (printed on your bill, typically 38–41 MJ/m³).
  - platform: template
    name: ${device_name} Gas Energy
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 60s
    lambda: |-
      if (!id(octo_gas).has_state()) return NAN;
      return id(octo_gas).state * 1.02264f * 39.5f / 3.6f;

text_sensor:
  - platform: wifi_info
    ssid:
      name: Connected SSID
    ip_address:
      name: IP Address
    dns_address:
      name: DNS Address

#######################################
# Device specific Config Begins Below #
#######################################

# Passive tap on the MGM210P (Zigbee NCP) TX line. RX only — never driven.
#   MGM210P TX -> GPIO4 ;  GND -> GND
uart:
  - id: ncp_uart
    rx_pin: GPIO4
    baud_rate: 115200
    rx_buffer_size: 1024

# Decode the Secure-EZSP stream and expose meter sensors to Home Assistant.
octopus_mini:
  uart_id: ncp_uart
  key: !secret octopus_uart_key
  power:
    name: ${device_name} Electricity Power
  import_energy:
    name: ${device_name} Electricity Import
  export_energy:
    name: ${device_name} Electricity Export
  gas:
    name: ${device_name} Gas
    id: octo_gas
  electricity_price:
    name: ${device_name} Electricity Unit Price
  gas_price:
    name: ${device_name} Gas Unit Price
